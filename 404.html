<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#061324">
  <title>404 — Page Not Found | Airnova</title>
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/atmosphere.css">
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 50% 20%, #0d2847 0%, #061324 70%);
      color: #fff;
      font-family: 'Inter', -apple-system, sans-serif;
      text-align: center;
      padding: 24px;
    }
    .box {
      max-width: 520px;
      padding: 48px 36px;
      border-radius: 24px;
      background: rgba(255, 255, 255, 0.04);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.4);
    }
    .code {
      font-size: 80px;
      font-weight: 800;
      line-height: 1;
      background: linear-gradient(135deg, #38bdf8, #10b981);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 16px;
      letter-spacing: -2px;
    }
    h1 {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 12px;
    }
    p {
      font-size: 15px;
      color: #94a3b8;
      line-height: 1.6;
      margin-bottom: 28px;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 12px 28px;
      background: linear-gradient(135deg, #0284c7, #10b981);
      color: #fff;
      font-weight: 600;
      font-size: 14px;
      border-radius: 999px;
      text-decoration: none;
      transition: all 0.2s ease;
      box-shadow: 0 4px 18px rgba(2, 132, 199, 0.35);
    }
    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(2, 132, 199, 0.5);
    }
  </style>
</head>
<body>
  <div class="box">
    <div class="code">404</div>
    <h1>Atmospheric Anomaly</h1>
    <p>The coordinate or station you are looking for does not exist in our current atmospheric grid.</p>
    <a href="/" class="btn">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 10 9-7 9 7M5 9v11h5v-6h4v6h5V9"/></svg>
      Return to Airnova Home
    </a>
  </div>
</body>
</html>
