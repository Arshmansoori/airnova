  <g filter="url(#wisps)"><ellipse cx="350" cy="230" rx="360" ry="62" fill="url(#soft)"/><ellipse cx="710" cy="180" rx="410" ry="72" fill="url(#soft)"/><ellipse cx="930" cy="265" rx="290" ry="48" fill="url(#soft)"/></g>
