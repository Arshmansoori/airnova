<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 520" width="100%" height="100%" style="background:#ffffff; font-family:'Inter', system-ui, -apple-system, sans-serif;">
  <defs>
    <!-- Soft Clean Shadow -->
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.06" />
    </filter>

    <!-- Gradients -->
    <linearGradient id="blueGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>

    <linearGradient id="amberGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <linearGradient id="greenGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>

    <!-- Arrow Markers -->
    <marker id="bigArrow" markerWidth="10" markerHeight="10" refX="7" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#64748b" />
    </marker>
  </defs>

  <!-- Canvas Background -->
  <rect width="1100" height="520" fill="#ffffff" rx="20" />

  <!-- HEADER -->
  <text x="550" y="48" text-anchor="middle" font-size="24" font-weight="900" fill="#0f172a">AirNova System Architecture (Simple 3-Step Flow)</text>
  <text x="550" y="74" text-anchor="middle" font-size="14" font-weight="500" fill="#64748b">How raw environmental data becomes life-saving citizen intelligence</text>

  <!-- CONNECTING BIG ARROWS -->
  <path d="M 360 270 L 400 270" stroke="#94a3b8" stroke-width="4" marker-end="url(#bigArrow)" />
  <path d="M 720 270 L 760 270" stroke="#94a3b8" stroke-width="4" marker-end="url(#bigArrow)" />

  <!-- ==================== STEP 1: INPUT DATA ==================== -->
  <g transform="translate(50, 110)">
    <!-- Main Outer Card -->
    <rect width="310" height="340" rx="18" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2" filter="url(#softShadow)" />
    
    <!-- Header Pill -->
    <rect x="20" y="20" width="270" height="42" rx="10" fill="url(#blueGrad)" />
    <text x="155" y="46" text-anchor="middle" font-size="14" font-weight="800" fill="#ffffff">STEP 1: DATA SOURCES</text>

    <!-- Sub items -->
    <g transform="translate(20, 80)">
      <!-- Item 1 -->
      <rect width="270" height="52" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
      <text x="15" y="24" font-size="12" font-weight="800" fill="#1e3a8a">📍 Govt Ground Stations (CPCB)</text>
      <text x="15" y="40" font-size="10.5" font-weight="600" fill="#64748b">Real-time PM2.5, PM10, toxic gases</text>

      <!-- Item 2 -->
      <g transform="translate(0, 62)">
        <rect width="270" height="52" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
        <text x="15" y="24" font-size="12" font-weight="800" fill="#1e3a8a">🛰️ Space Satellites (ESA &amp; NASA)</text>
        <text x="15" y="40" font-size="10.5" font-weight="600" fill="#64748b">Aerosol depth &amp; crop stubble fires</text>
      </g>

      <!-- Item 3 -->
      <g transform="translate(0, 124)">
        <rect width="270" height="52" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
        <text x="15" y="24" font-size="12" font-weight="800" fill="#1e3a8a">🗺️ City Map &amp; Live Traffic</text>
        <text x="15" y="40" font-size="10.5" font-weight="600" fill="#64748b">Building heights, roads, traffic jams</text>
      </g>

      <!-- Item 4 -->
      <g transform="translate(0, 186)">
        <rect width="270" height="42" rx="10" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1" />
        <text x="135" y="26" text-anchor="middle" font-size="11" font-weight="700" fill="#2563eb">🔄 100% Free &amp; Open Data Feeds</text>
      </g>
    </g>
  </g>

  <!-- ==================== STEP 2: PROCESSING ENGINE ==================== -->
  <g transform="translate(410, 110)">
    <!-- Main Outer Card -->
    <rect width="310" height="340" rx="18" fill="#fffbeb" stroke="#fef3c7" stroke-width="2" filter="url(#softShadow)" />

    <!-- Header Pill -->
    <rect x="20" y="20" width="270" height="42" rx="10" fill="url(#amberGrad)" />
    <text x="155" y="46" text-anchor="middle" font-size="14" font-weight="800" fill="#ffffff">STEP 2: AIRNOVA ENGINE</text>

    <!-- Sub items -->
    <g transform="translate(20, 80)">
      <!-- Item 1 -->
      <rect width="270" height="52" rx="10" fill="#ffffff" stroke="#fde68a" stroke-width="1" />
      <text x="15" y="24" font-size="12" font-weight="800" fill="#92400e">🧹 Data Cleaning &amp; Security</text>
      <text x="15" y="40" font-size="10.5" font-weight="600" fill="#78350f">Removes errors + Auto-failover backup</text>

      <!-- Item 2 -->
      <g transform="translate(0, 62)">
        <rect width="270" height="52" rx="10" fill="#ffffff" stroke="#fde68a" stroke-width="1" />
        <text x="15" y="24" font-size="12" font-weight="800" fill="#92400e">📐 Standard CPCB NAQI Math</text>
        <text x="15" y="40" font-size="10.5" font-weight="600" fill="#78350f">Official Indian formula + US EPA toggle</text>
      </g>

      <!-- Item 3 -->
      <g transform="translate(0, 124)">
        <rect width="270" height="52" rx="10" fill="#ffffff" stroke="#fde68a" stroke-width="1" />
        <text x="15" y="24" font-size="12" font-weight="800" fill="#92400e">🌪️ Atmospheric Physics Models</text>
        <text x="15" y="40" font-size="10.5" font-weight="600" fill="#78350f">Ventilation Index &amp; Winter Smog Traps</text>
      </g>

      <!-- Item 4 -->
      <g transform="translate(0, 186)">
        <rect width="270" height="42" rx="10" fill="#fef3c7" stroke="#fcd34d" stroke-width="1" />
        <text x="135" y="26" text-anchor="middle" font-size="11" font-weight="700" fill="#b45309">⚡ Fast &amp; Deterministic (Zero AI)</text>
      </g>
    </g>
  </g>

  <!-- ==================== STEP 3: CITIZEN OUTPUT ==================== -->
  <g transform="translate(770, 110)">
    <!-- Main Outer Card -->
    <rect width="310" height="340" rx="18" fill="#f0fdf4" stroke="#dcfce7" stroke-width="2" filter="url(#softShadow)" />

    <!-- Header Pill -->
    <rect x="20" y="20" width="270" height="42" rx="10" fill="url(#greenGrad)" />
    <text x="155" y="46" text-anchor="middle" font-size="14" font-weight="800" fill="#ffffff">STEP 3: CITIZEN BENEFITS</text>

    <!-- Sub items -->
    <g transform="translate(20, 80)">
      <!-- Item 1 -->
      <rect width="270" height="52" rx="10" fill="#ffffff" stroke="#bbf7d0" stroke-width="1" />
      <text x="15" y="24" font-size="12" font-weight="800" fill="#065f46">🏘️ Local Gali / Park AQI</text>
      <text x="15" y="40" font-size="10.5" font-weight="600" fill="#047857">Street-level air without any new hardware</text>

      <!-- Item 2 -->
      <g transform="translate(0, 62)">
        <rect width="270" height="52" rx="10" fill="#ffffff" stroke="#bbf7d0" stroke-width="1" />
        <text x="15" y="24" font-size="12" font-weight="800" fill="#065f46">⏱️ 72-Hour Smog Advance Alert</text>
        <text x="15" y="40" font-size="10.5" font-weight="600" fill="#047857">Early warning for asthma &amp; schools</text>
      </g>

      <!-- Item 3 -->
      <g transform="translate(0, 124)">
        <rect width="270" height="52" rx="10" fill="#ffffff" stroke="#bbf7d0" stroke-width="1" />
        <text x="15" y="24" font-size="12" font-weight="800" fill="#065f46">💡 Room Purifier Timer</text>
        <text x="15" y="40" font-size="10.5" font-weight="600" fill="#047857">"Clean in 20 mins" → Saves 35% power</text>
      </g>

      <!-- Item 4 -->
      <g transform="translate(0, 186)">
        <rect width="270" height="42" rx="10" fill="#dcfce7" stroke="#86efac" stroke-width="1" />
        <text x="135" y="26" text-anchor="middle" font-size="11" font-weight="700" fill="#059669">🚀 Sub-150ms Speed at airnova.space</text>
      </g>
    </g>
  </g>
</svg>
