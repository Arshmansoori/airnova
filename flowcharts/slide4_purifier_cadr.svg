<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" width="100%" height="100%" style="background:#ffffff; border-radius:18px;">
  <defs>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.06" />
    </filter>
    <linearGradient id="roomGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#faf5ff" />
      <stop offset="100%" stop-color="#f3e8ff" />
    </linearGradient>
    <linearGradient id="avatarGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f0fdf4" />
      <stop offset="100%" stop-color="#dcfce7" />
    </linearGradient>
  </defs>

  <!-- Header -->
  <text x="40" y="42" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" font-weight="800" fill="#7e22ce" letter-spacing="1.5">INDOOR MASS-BALANCE PHYSICS &amp; DYNAMIC AVATAR FLOWCHART</text>
  <text x="40" y="66" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="18" font-weight="800" fill="#0f172a">Room Air Cleanup Time Calculation &amp; Autonomous Personal Protection</text>

  <!-- LEFT: Indoor Room Physics Flowchart -->
  <g transform="translate(40, 95)" filter="url(#cardShadow)">
    <rect width="450" height="320" rx="16" fill="url(#roomGrad)" stroke="#d8b4fe" stroke-width="1.5" />
    
    <rect x="18" y="16" width="220" height="24" rx="6" fill="#7e22ce" />
    <text x="128" y="32" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#ffffff" text-anchor="middle">⚡ ROOM MASS-BALANCE MODEL</text>

    <!-- Formula Box -->
    <g transform="translate(18, 54)">
      <rect width="414" height="42" rx="8" fill="#ffffff" stroke="#c084fc" />
      <text x="207" y="26" font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="800" fill="#581c87" text-anchor="middle">
        V·(dC/dt) = -(CADR + k·V)·C + P_infil·ACH·V·C_out
      </text>
    </g>

    <!-- 3 Input Variables -->
    <g transform="translate(18, 110)">
      <rect width="130" height="70" rx="10" fill="#ffffff" stroke="#e9d5ff" />
      <text x="65" y="24" font-family="system-ui, sans-serif" font-size="10" font-weight="800" fill="#6b21a8" text-anchor="middle">1. ROOM VOLUME</text>
      <text x="65" y="42" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="800" fill="#0f172a" text-anchor="middle">L × W × H</text>
      <text x="65" y="58" font-family="system-ui, sans-serif" font-size="9" fill="#64748b" text-anchor="middle">e.g. 5m × 4m × 3m</text>
    </g>

    <g transform="translate(160, 110)">
      <rect width="130" height="70" rx="10" fill="#ffffff" stroke="#e9d5ff" />
      <text x="65" y="24" font-family="system-ui, sans-serif" font-size="10" font-weight="800" fill="#6b21a8" text-anchor="middle">2. PURIFIER CADR</text>
      <text x="65" y="42" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="800" fill="#0f172a" text-anchor="middle">m³/hour</text>
      <text x="65" y="58" font-family="system-ui, sans-serif" font-size="9" fill="#64748b" text-anchor="middle">e.g. 350 m³/h</text>
    </g>

    <g transform="translate(302, 110)">
      <rect width="130" height="70" rx="10" fill="#ffffff" stroke="#e9d5ff" />
      <text x="65" y="24" font-family="system-ui, sans-serif" font-size="10" font-weight="800" fill="#6b21a8" text-anchor="middle">3. INFILTRATION</text>
      <text x="65" y="42" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="800" fill="#0f172a" text-anchor="middle">ACH Rate</text>
      <text x="65" y="58" font-family="system-ui, sans-serif" font-size="9" fill="#64748b" text-anchor="middle">Air exchange / hr</text>
    </g>

    <!-- Calculated Output Banner -->
    <g transform="translate(18, 195)">
      <rect width="414" height="105" rx="12" fill="#ffffff" stroke="#a855f7" stroke-width="1.5" />
      <text x="20" y="28" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#581c87">EXACT CLEANUP RUNTIME OUTPUT:</text>
      
      <rect x="20" y="40" width="180" height="50" rx="8" fill="#faf5ff" border="1px solid #d8b4fe" />
      <text x="110" y="65" font-family="'JetBrains Mono', monospace" font-size="18" font-weight="800" fill="#7e22ce" text-anchor="middle">42 Minutes</text>
      <text x="110" y="80" font-family="system-ui, sans-serif" font-size="9.5" fill="#64748b" text-anchor="middle">Target PM2.5 &lt; 25 µg/m³</text>

      <g transform="translate(210, 40)">
        <text x="0" y="16" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#065f46">✓ Energy Savings: 35% Electricity</text>
        <text x="0" y="34" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#065f46">✓ Extends HEPA Filter Life</text>
        <text x="0" y="50" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#065f46">✓ Live on airnova.space/purifier</text>
      </g>
    </g>
  </g>

  <!-- RIGHT: Dynamic Vector Avatar Flowchart -->
  <g transform="translate(510, 95)" filter="url(#cardShadow)">
    <rect width="450" height="320" rx="16" fill="url(#avatarGrad)" stroke="#86efac" stroke-width="1.5" />
    
    <rect x="18" y="16" width="220" height="24" rx="6" fill="#059669" />
    <text x="128" y="32" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#ffffff" text-anchor="middle">🛡️ DYNAMIC VECTOR AVATAR</text>

    <!-- Subtitle -->
    <text x="18" y="60" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#064e3b">
      Automatic Visual Protection Trigger for Common Citizens
    </text>

    <!-- State 1: Clean Air -->
    <g transform="translate(18, 75)">
      <rect width="414" height="105" rx="12" fill="#ffffff" stroke="#86efac" stroke-width="1.5" />
      <circle cx="45" cy="52" r="28" fill="#dcfce7" />
      <text x="45" y="60" font-size="26" text-anchor="middle">😊</text>
      
      <text x="90" y="34" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#065f46">STATE 1: AQI ≤ 100 (CLEAN AIR)</text>
      <text x="90" y="54" font-family="system-ui, sans-serif" font-size="10.5" font-weight="600" fill="#475569">• Unmasked cheerful smile, natural outdoor breathing</text>
      <text x="90" y="70" font-family="system-ui, sans-serif" font-size="10.5" font-weight="600" fill="#475569">• Safe for jogging, sports, schools &amp; elder morning walks</text>
      <text x="90" y="86" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#059669">Pill: Clean Air • No Mask Needed 🍃</text>
    </g>

    <!-- State 2: High AQI -->
    <g transform="translate(18, 195)">
      <rect width="414" height="105" rx="12" fill="#ffffff" stroke="#fca5a5" stroke-width="1.5" />
      <circle cx="45" cy="52" r="28" fill="#fee2e2" />
      <text x="45" y="60" font-size="26" text-anchor="middle">😷</text>
      
      <text x="90" y="34" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#991b1b">STATE 2: AQI &gt; 100 (SMOG SPIKE ALERT)</text>
      <text x="90" y="54" font-family="system-ui, sans-serif" font-size="10.5" font-weight="600" fill="#475569">• Automatically equips sleek fitted N95 respirator mask</text>
      <text x="90" y="70" font-family="system-ui, sans-serif" font-size="10.5" font-weight="600" fill="#475569">• Cool-flow air valve + vigilant protective eyes</text>
      <text x="90" y="86" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#dc2626">Pill: N95 Mask Protection Active 🛡️</text>
    </g>
  </g>
</svg>
