<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" width="100%" height="100%" style="background:#ffffff; border-radius:18px;">
  <defs>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.06" />
    </filter>

    <linearGradient id="daySky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e0f2fe" />
      <stop offset="100%" stop-color="#bae6fd" />
    </linearGradient>

    <linearGradient id="nightSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <marker id="arrowRed" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#ef4444" />
    </marker>
  </defs>

  <!-- Header -->
  <text x="40" y="42" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" font-weight="800" fill="#2563eb" letter-spacing="1.5">ATMOSPHERIC FLUID DYNAMICS &amp; NOCTURNAL SMOG TRAPPING</text>
  <text x="40" y="66" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="18" font-weight="800" fill="#0f172a">How Planetary Boundary Layer (PBL) Collapse Creates Urban Gas Chambers</text>

  <!-- Left: Daytime Dispersion -->
  <g transform="translate(40, 95)" filter="url(#cardShadow)">
    <rect width="440" height="235" rx="16" fill="url(#daySky)" stroke="#7dd3fc" stroke-width="1.5" />
    
    <!-- Title Badge -->
    <rect x="18" y="16" width="130" height="24" rx="6" fill="#0284c7" />
    <text x="83" y="32" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#ffffff" text-anchor="middle">☀️ DAYTIME DILUTION</text>

    <!-- Sun Icon -->
    <circle cx="400" cy="35" r="16" fill="#fbbf24" />

    <!-- Boundary Ceiling Line -->
    <line x1="20" y1="80" x2="420" y2="80" stroke="#0284c7" stroke-width="2.5" stroke-dasharray="4 4" />
    <text x="24" y="72" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#0369a1">PBL CEILING: 1,500 METERS HIGH</text>

    <!-- Upward Dispersion Arrows -->
    <path d="M 120 170 L 120 100" stroke="#0284c7" stroke-width="2" marker-end="url(#arrowRed)" />
    <path d="M 220 170 L 220 100" stroke="#0284c7" stroke-width="2" marker-end="url(#arrowRed)" />
    <path d="M 320 170 L 320 100" stroke="#0284c7" stroke-width="2" marker-end="url(#arrowRed)" />

    <!-- Ground Cities -->
    <rect x="0" y="190" width="440" height="45" rx="0" fill="#cbd5e1" />
    <text x="220" y="218" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#334155" text-anchor="middle">City Ground Level • High Thermal Mixing • Safe Dispersion</text>
  </g>

  <!-- Right: Nighttime Inversion Trap -->
  <g transform="translate(520, 95)" filter="url(#cardShadow)">
    <rect width="440" height="235" rx="16" fill="url(#nightSky)" stroke="#4338ca" stroke-width="1.5" />
    
    <!-- Title Badge -->
    <rect x="18" y="16" width="160" height="24" rx="6" fill="#dc2626" />
    <text x="98" y="32" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#ffffff" text-anchor="middle">🌙 NOCTURNAL SMOG TRAP</text>

    <!-- Moon Icon -->
    <circle cx="400" cy="35" r="14" fill="#f8fafc" />

    <!-- Trapped Boundary Ceiling Line -->
    <line x1="20" y1="140" x2="420" y2="140" stroke="#ef4444" stroke-width="3" />
    <text x="24" y="132" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#f87171">COLLAPSED CEILING: &lt; 250 METERS (SMOG LID!)</text>

    <!-- Trapped Smoke Cloud -->
    <rect x="20" y="145" width="400" height="45" rx="6" fill="rgba(239, 68, 68, 0.25)" stroke="#ef4444" stroke-width="1" />
    <text x="220" y="172" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#fecaca" text-anchor="middle">⚠️ Trapped PM2.5 &amp; Toxic Gases Cannot Escape!</text>

    <!-- Ground Cities -->
    <rect x="0" y="190" width="440" height="45" rx="0" fill="#1e293b" />
    <text x="220" y="218" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#94a3b8" text-anchor="middle">Zero Dispersion • Ventilation Index &lt; 1,000 m²/s • Severe Danger</text>
  </g>

  <!-- Bottom Physics Math Bar -->
  <g transform="translate(40, 345)" filter="url(#cardShadow)">
    <rect width="920" height="75" rx="14" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5" />
    
    <text x="24" y="30" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#2563eb">MATHEMATICAL DISPERSION FORMULA (ECMWF &amp; CPCB CALIBRATED):</text>
    <text x="24" y="54" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="800" fill="#0f172a">Ventilation Index (VI) = Boundary Layer Height (m) × Wind Speed (m/s)</text>
    
    <rect x="680" y="20" width="220" height="35" rx="8" fill="#dcfce7" stroke="#86efac" stroke-width="1" />
    <text x="790" y="42" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#065f46" text-anchor="middle">AirNova 72h Inversion Forecast ✓</text>
  </g>
</svg>
