      <text x="14" y="24" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#065f46">📈 72h Timeline Scrubber</text>
      <text x="14" y="42" font-family="system-ui, sans-serif" font-size="9.5" font-weight="600" fill="#059669">Predicts midnight smog traps</text>
    </g>

    <!-- Output 3 -->
    <g transform="translate(0, 150)" filter="url(#cardShadow)">
      <rect width="200" height="56" rx="12" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5" />
      <text x="14" y="24" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#065f46">🗺️ Leaflet Heatmap Map</text>
      <text x="14" y="42" font-family="system-ui, sans-serif" font-size="9.5" font-weight="600" fill="#059669">Nearest sensor routing &amp; GPS</text>
