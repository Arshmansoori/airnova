      <text x="14" y="24" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#1e3a8a">📍 DPCC CAAQMS Sensors</text>
      <text x="14" y="42" font-family="system-ui, sans-serif" font-size="9.5" font-weight="600" fill="#3b82f6">Physical PM2.5, PM10, CO, NO2, O3</text>
