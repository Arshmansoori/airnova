      <text x="14" y="24" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#065f46">🛡️ Dynamic Vector Avatar</text>
      <text x="14" y="42" font-family="system-ui, sans-serif" font-size="9.5" font-weight="600" fill="#059669">N95 mask equips automatically</text>
