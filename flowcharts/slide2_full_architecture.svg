  <text x="40" y="66" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="18" font-weight="800" fill="#0f172a">How All 8 Modules Connect into One High-Performance Edge Engine</text>

  <!-- Flow Connector Lines from Inputs to Core -->
  <path d="M 240 135 C 310 135, 310 220, 360 220" fill="none" stroke="#93c5fd" stroke-width="2.5" marker-end="url(#arrowBlue)" />
  <path d="M 240 205 C 310 205, 310 235, 360 235" fill="none" stroke="#93c5fd" stroke-width="2.5" marker-end="url(#arrowBlue)" />
  <path d="M 240 275 C 310 275, 310 250, 360 250" fill="none" stroke="#93c5fd" stroke-width="2.5" marker-end="url(#arrowBlue)" />
  <path d="M 240 345 C 310 345, 310 265, 360 265" fill="none" stroke="#93c5fd" stroke-width="2.5" marker-end="url(#arrowBlue)" />

  <!-- Flow Connector Lines from Core to Outputs -->
  <path d="M 640 220 C 690 220, 690 135, 750 135" fill="none" stroke="#6ee7b7" stroke-width="2.5" marker-end="url(#arrowGreen)" />
  <path d="M 640 235 C 690 235, 690 205, 750 205" fill="none" stroke="#6ee7b7" stroke-width="2.5" marker-end="url(#arrowGreen)" />
  <path d="M 640 250 C 690 250, 690 275, 750 275" fill="none" stroke="#6ee7b7" stroke-width="2.5" marker-end="url(#arrowGreen)" />
  <path d="M 640 265 C 690 265, 690 345, 750 345" fill="none" stroke="#6ee7b7" stroke-width="2.5" marker-end="url(#arrowGreen)" />

