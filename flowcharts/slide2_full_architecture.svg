      <text x="12" y="20" font-family="system-ui, sans-serif" font-size="10.5" font-weight="800" fill="#6ee7b7">📐 Differential CADR Math</text>
      <text x="12" y="36" font-family="system-ui, sans-serif" font-size="9" fill="#a7f3d0">Room mass-balance aerosol decay calculation</text>
