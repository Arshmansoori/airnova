    <rect width="920" height="36" rx="10" fill="#f8fafc" stroke="#e2e8f0" />
    <text x="460" y="23" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#475569" text-anchor="middle">
      Live Production Verified on <tspan fill="#059669" font-weight="800">https://airnova.space</tspan> • 33/33 Automated Tests Passing • Zero Downtime Edge Architecture
