    <text x="75" y="108" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="800" fill="#059669" text-anchor="middle">45 ms</text>
    <text x="75" y="122" font-family="system-ui, sans-serif" font-size="8.5" fill="#64748b" text-anchor="middle">High-res grid</text>

