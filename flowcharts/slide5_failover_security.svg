  <!-- Bottom Security Pillars -->
  <g transform="translate(40, 310)" filter="url(#cardShadow)">
    <rect width="920" height="95" rx="14" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5" />
    
    <g transform="translate(24, 20)">
      <text x="0" y="16" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#0f172a">🔒 AES-GCM Encrypted Key Management</text>
      <text x="0" y="34" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#64748b">Zero client browser token exposure. All station credentials stored with authenticated cryptography.</text>
      <text x="0" y="52" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#64748b">D1 atomic rate limiting prevents DDoS and scraping attacks.</text>
    </g>

    <g transform="translate(560, 20)">
      <text x="0" y="16" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#059669">💰 $0 Operating Cost at 100k+ Users</text>
      <text x="0" y="34" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#64748b">Edge memory caching prevents duplicate upstream API calls.</text>
      <text x="0" y="52" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#64748b">100% free open-access European Copernicus CAMS grid fallback.</text>
    </g>
