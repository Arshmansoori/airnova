    <rect x="12" y="90" width="136" height="42" rx="6" fill="#ffffff" stroke="#bbf7d0" />
    <text x="80" y="108" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="800" fill="#059669" text-anchor="middle">&lt; 15 ms</text>
    <text x="80" y="122" font-family="system-ui, sans-serif" font-size="8.5" fill="#047857" text-anchor="middle">Instant edge delivery</text>

    <text x="12" y="155" font-family="system-ui, sans-serif" font-size="9.5" font-weight="800" fill="#059669">✓ 100% Uptime</text>
