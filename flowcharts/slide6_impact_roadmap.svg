<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" width="100%" height="100%" style="background:#ffffff; border-radius:18px;">
  <defs>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.06" />
    </filter>
    <marker id="arrowPurple" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#7e22ce" />
    </marker>
  </defs>

  <!-- Header -->
  <text x="40" y="42" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" font-weight="800" fill="#7e22ce" letter-spacing="1.5">CITIZEN IMPACT, SMART CITY B2G MODEL &amp; ROADMAP FLOWCHART</text>
  <text x="40" y="66" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="18" font-weight="800" fill="#0f172a">Measurable Health Prevention, Commercial Viability &amp; Pan-India Scaling</text>

  <!-- TOP: 3 IMPACT PILLARS -->
  <g transform="translate(40, 95)">
    
    <!-- Pillar 1: Health -->
    <g transform="translate(0, 0)" filter="url(#cardShadow)">
      <rect width="290" height="120" rx="14" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5" />
      <rect x="14" y="14" width="70" height="20" rx="6" fill="#059669" />
      <text x="49" y="28" font-family="system-ui, sans-serif" font-size="9.5" font-weight="800" fill="#ffffff" text-anchor="middle">HEALTH</text>
      
      <text x="14" y="58" font-family="'JetBrains Mono', monospace" font-size="20" font-weight="800" fill="#065f46">28% Drop</text>
      <text x="14" y="76" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#0f172a">In Emergency Asthma Visits</text>
      <text x="14" y="94" font-family="system-ui, sans-serif" font-size="9.5" font-weight="600" fill="#475569">8-hour advance warnings allow timely preventive inhaler medication.</text>
    </g>

    <!-- Pillar 2: Energy -->
    <g transform="translate(315, 0)" filter="url(#cardShadow)">
      <rect width="290" height="120" rx="14" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5" />
      <rect x="14" y="14" width="70" height="20" rx="6" fill="#2563eb" />
      <text x="49" y="28" font-family="system-ui, sans-serif" font-size="9.5" font-weight="800" fill="#ffffff" text-anchor="middle">ENERGY</text>
      
      <text x="14" y="58" font-family="'JetBrains Mono', monospace" font-size="20" font-weight="800" fill="#1e40af">35% Saved</text>
      <text x="14" y="76" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#0f172a">In Household Electricity</text>
      <text x="14" y="94" font-family="system-ui, sans-serif" font-size="9.5" font-weight="600" fill="#475569">CADR mass-balance stops purifiers from running blindly 24/7 on max.</text>
    </g>

    <!-- Pillar 3: Smart Cities -->
    <g transform="translate(630, 0)" filter="url(#cardShadow)">
      <rect width="290" height="120" rx="14" fill="#faf5ff" stroke="#d8b4fe" stroke-width="1.5" />
      <rect x="14" y="14" width="80" height="20" rx="6" fill="#7e22ce" />
      <text x="54" y="28" font-family="system-ui, sans-serif" font-size="9.5" font-weight="800" fill="#ffffff" text-anchor="middle">GOVERNANCE</text>
      
      <text x="14" y="58" font-family="'JetBrains Mono', monospace" font-size="20" font-weight="800" fill="#581c87">City Guns</text>
      <text x="14" y="76" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#0f172a">Targeted Anti-Smog Spray</text>
      <text x="14" y="94" font-family="system-ui, sans-serif" font-size="9.5" font-weight="600" fill="#475569">Sprinklers deployed at pinpoint hotspots before inversion peaks.</text>
    </g>
  </g>

  <!-- BOTTOM: 3-PHASE ROADMAP STEPPER -->
  <g transform="translate(40, 240)" filter="url(#cardShadow)">
    <rect width="920" height="175" rx="16" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5" />
    
    <text x="24" y="30" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" font-weight="800" fill="#0f172a">3-PHASE SCALABLE EXECUTION ROADMAP:</text>

    <!-- Stepper Connector Line -->
    <path d="M 280 90 L 320 90" stroke="#7e22ce" stroke-width="3" marker-end="url(#arrowPurple)" />
    <path d="M 580 90 L 620 90" stroke="#7e22ce" stroke-width="3" marker-end="url(#arrowPurple)" />

    <!-- Phase 1 -->
    <g transform="translate(24, 45)">
      <rect width="250" height="110" rx="12" fill="#ffffff" stroke="#86efac" stroke-width="1.5" />
      <rect x="12" y="10" width="130" height="20" rx="5" fill="#dcfce7" />
      <text x="77" y="24" font-family="system-ui, sans-serif" font-size="9" font-weight="800" fill="#065f46" text-anchor="middle">PHASE 1 [COMPLETED]</text>
      
      <text x="12" y="50" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#064e3b">Web Platform &amp; Physics</text>
      <text x="12" y="70" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#64748b">• Live today at airnova.space</text>
      <text x="12" y="86" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#64748b">• 8 Working tabs &amp; 72h models</text>
      <text x="12" y="102" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#64748b">• CPCB NAQI standard switch</text>
    </g>

    <!-- Phase 2 -->
    <g transform="translate(325, 45)">
      <rect width="250" height="110" rx="12" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.5" />
      <rect x="12" y="10" width="130" height="20" rx="5" fill="#dbeafe" />
      <text x="77" y="24" font-family="system-ui, sans-serif" font-size="9" font-weight="800" fill="#1e40af" text-anchor="middle">PHASE 2 [Q1 2026]</text>
      
      <text x="12" y="50" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#1e3a8a">IoT Mesh Sensor Grid</text>
      <text x="12" y="70" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#64748b">• Low-cost ₹1,800 optical nodes</text>
      <text x="12" y="86" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#64748b">• 100m street-level resolution</text>
      <text x="12" y="102" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#64748b">• Solar-powered wireless mesh</text>
    </g>

    <!-- Phase 3 -->
    <g transform="translate(625, 45)">
      <rect width="265" height="110" rx="12" fill="#ffffff" stroke="#d8b4fe" stroke-width="1.5" />
      <rect x="12" y="10" width="130" height="20" rx="5" fill="#f3e8ff" />
      <text x="77" y="24" font-family="system-ui, sans-serif" font-size="9" font-weight="800" fill="#6b21a8" text-anchor="middle">PHASE 3 [Q2 2026]</text>
      
      <text x="12" y="50" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#581c87">AI Source Attribution</text>
      <text x="12" y="70" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#64748b">• Deep learning classifier</text>
      <text x="12" y="86" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#64748b">• Vehicular vs biomass smoke</text>
      <text x="12" y="102" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#64748b">• Pan-India municipal licensing</text>
    </g>
  </g>
</svg>
